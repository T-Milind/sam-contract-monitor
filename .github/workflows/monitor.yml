name: SAM.gov IT Contract Monitor

on:
  schedule:
    # Spread across US business hours (~8am/11am/2pm/5pm US Eastern)
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: sam-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "sam-monitor-bot"
          git config user.email "actions@github.com"
          git add state/seen_ids.json
          git diff --staged --quiet || git commit -m "Update seen-notice state [skip ci]"
          git push
